base:
  image: ${{ init.base-image }}
  config: ${{ init.base-config }}
  arch: ${{ init.base-arch }}

tasks:
  - key: install-3-14-7
    call: ${{ init.package-digest }}
    with:
      python-version: 3.14.7

  - key: install-3-14-7--assert
    use: install-3-14-7
    run: |
      python --version | grep 'Python 3\.14\.7'
      pip --version | grep '(python 3\.14)'

  - key: install-3-14-7--test-pip-install
    use: install-3-14-7
    run: |
      pip install virtualenv
      which virtualenv
      virtualenv --version

  - key: install-3-12-13
    call: ${{ init.package-digest }}
    with:
      python-version: 3.12.13

  - key: install-3-12-13--assert
    use: install-3-12-13
    run: |
      python --version | grep 'Python 3\.12\.13'
      pip --version | grep '(python 3\.12)'

  - key: install-3-12-13--test-pip-install
    use: install-3-12-13
    run: |
      pip install virtualenv
      which virtualenv
      virtualenv --version

  - key: install-3-11-16
    call: ${{ init.package-digest }}
    with:
      python-version: 3.11.16

  - key: install-3-11-16--assert
    use: install-3-11-16
    run: |
      python --version | grep 'Python 3\.11\.16'
      pip --version | grep '(python 3\.11)'

  - key: install-3-10-21
    call: ${{ init.package-digest }}
    with:
      python-version: 3.10.21

  - key: install-3-10-21--assert
    use: install-3-10-21
    run: |
      python --version | grep 'Python 3\.10\.21'
      pip --version | grep '(python 3\.10)'

  - key: install-3-9-25
    call: ${{ init.package-digest }}
    with:
      python-version: 3.9.25

  - key: install-3-9-25--assert
    use: install-3-9-25
    run: |
      python --version | grep 'Python 3\.9\.25'
      pip --version | grep '(python 3\.9)'

  - key: upgrade-pip
    call: ${{ init.package-digest }}
    with:
      python-version: 3.12.6
      pip-version: 24.1
      ensure-github-attestations: "false"

  - key: upgrade-pip--assert
    use: upgrade-pip
    run: |
      python --version | grep 'Python 3\.12\.6'
      pip --version | grep 'pip 24\.1'

  - key: upgrade-setuptools
    call: ${{ init.package-digest }}
    with:
      python-version: 3.12.13
      setuptools-version: 72.1.0

  - key: upgrade-setuptools--assert
    use: upgrade-setuptools
    run: |
      python --version | grep 'Python 3\.12\.13'
      pip show setuptools | grep Version | grep '72\.1\.0'

  - key: upgrade-pip-and-setuptools
    call: ${{ init.package-digest }}
    with:
      python-version: 3.12.13
      pip-version: 24.1
      setuptools-version: 72.1.0

  - key: upgrade-pip-and-setuptools--assert
    use: upgrade-pip-and-setuptools
    run: |
      python --version | grep 'Python 3\.12\.13'
      pip --version | grep 'pip 24\.1'
      pip show setuptools | grep Version | grep '72\.1\.0'
