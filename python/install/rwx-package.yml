name: python/install
version: 2.0.0
description: Install Python, a programming language that lets you work quickly and integrate systems more effectively
source_code_url: https://github.com/rwx-cloud/packages/tree/main/python/install
issue_tracker_url: https://github.com/rwx-cloud/packages/issues

parameters:
  python-version:
    description: "Version of Python to install"
    required: true
  pip-version:
    description: "Version of pip to install"
    required: false
  setuptools-version:
    description: "Version of setuptools to install"
    required: false
  ensure-github-attestations:
    description: "Verify GitHub artifact attestations for the precompiled binary before installing it"
    default: "true"

tasks:
  - key: install-python
    run: |
      set -u

      #
      # Check OS support
      #
      source "$RWX_PACKAGE_PATH/rwx-utils.sh"
      if ! rwx_os_package_manager_in apt; then
        echo "Unsupported operating system or package manager \`$(rwx_os_package_manager)\`" > "$(mktemp "$RWX_ERRORS/error-XXXX")"
        exit 1
      fi

      #
      # Ensure we have a python version
      #
      if [ "$PYTHON_VERSION" = "" ]; then
        cat << EOF > $(mktemp "$RWX_ERRORS/error-XXXX")
      Invalid parameters: \`python-version\` must be set.
      EOF
        exit 2
      fi

      #
      # Ensure prerequisites for installing mise
      #
      if ! command -v curl >/dev/null 2>&1; then
        rwx_maybe_sudo apt-get update
        rwx_maybe_sudo apt-get install --no-upgrade -y curl ca-certificates
        rwx_maybe_sudo apt-get clean
      fi

      #
      # Install mise into a temporary directory. mise resolves the Python
      # version to the right precompiled binary and verifies its checksum;
      # the Python install is moved out and mise is deleted afterwards, so
      # mise itself is not persisted in the task's filesystem.
      #
      mise_dir=$(mktemp -d)
      export MISE_INSTALL_PATH="$mise_dir/bin/mise"
      export MISE_DATA_DIR="$mise_dir/data"
      export MISE_CACHE_DIR="$mise_dir/cache"
      export MISE_STATE_DIR="$mise_dir/state"
      export MISE_CONFIG_DIR="$mise_dir/config"

      curl -fsSL https://mise.run | sh
      export PATH="$mise_dir/bin:$PATH"
      mise --version

      if [ "$ENSURE_GITHUB_ATTESTATIONS" = "false" ]; then
        export MISE_GITHUB_ATTESTATIONS=false
      fi

      #
      # Install Python from the mise precompiled binaries.
      # MISE_PYTHON_COMPILE=false errors out if no precompiled binary is
      # available rather than falling back to compiling from source.
      #
      mise_log=$(mktemp)
      echo "Installing Python $PYTHON_VERSION..."
      if ! MISE_PYTHON_COMPILE=false mise install "python@$PYTHON_VERSION" 2>&1 | tee "$mise_log"; then
        if grep -i "error" "$mise_log" | grep -qi "attestation"; then
          cat << EOF > $(mktemp "$RWX_ERRORS/error-XXXX")
      Failed to verify the GitHub artifact attestations for the Python $PYTHON_VERSION precompiled binary.
      Try installing a different patch version of Python, or set the \`ensure-github-attestations\` parameter to \`"false"\` to skip attestation verification.
      EOF
        else
          cat << EOF > $(mktemp "$RWX_ERRORS/error-XXXX")
      Failed to install Python $PYTHON_VERSION from the [mise precompiled binaries](https://mise.jdx.dev/lang/python.html#precompiled-python-binaries).
      [python/install](https://www.rwx.com/docs/mint/packages/python/install) supports any Python version with a precompiled binary available for this platform.
      EOF
        fi
        exit 3
      fi
      rm -f "$mise_log"

      #
      # Move Python to its final home and remove mise. The precompiled
      # binaries are relocatable, so they run from any directory.
      #
      source_dir=$(realpath "$(mise where "python@$PYTHON_VERSION")")
      resolved_version=$(basename "$source_dir")
      path_to_python_home="$HOME/.pythons/python-$resolved_version"
      mkdir -p "$HOME/.pythons"
      rm -rf "$path_to_python_home"
      mv "$source_dir" "$path_to_python_home"
      rm -rf "$mise_dir"
      echo "Installed Python $resolved_version!"

      # Add Python to PATH
      path_to_python="$path_to_python_home/bin"
      echo "Adding $HOME/.local/bin:$path_to_python to \$PATH"
      export PATH="$HOME/.local/bin:$path_to_python:$PATH"
      echo "$HOME/.local/bin:$path_to_python" >> "$RWX_ENV/PATH"

      if [ -n "${PIP_VERSION}" ]; then
        echo "Installing pip ${PIP_VERSION}"
        pip install pip==$PIP_VERSION
        pip --version
      fi

      if [ -n "${SETUPTOOLS_VERSION}" ]; then
        echo "Installing setuptools ${SETUPTOOLS_VERSION}"
        pip install setuptools==$SETUPTOOLS_VERSION
        pip show setuptools | grep Version
      fi
    env:
      PIP_VERSION: ${{ params.pip-version }}
      SETUPTOOLS_VERSION: ${{ params.setuptools-version }}
      PYTHON_VERSION: ${{ params.python-version }}
      ENSURE_GITHUB_ATTESTATIONS: ${{ params.ensure-github-attestations }}
