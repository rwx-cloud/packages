name: ruby/install
version: 2.0.0
description: Install Ruby, a dynamic programming language with a focus on simplicity and productivity
source_code_url: https://github.com/rwx-cloud/packages/tree/main/ruby/install
issue_tracker_url: https://github.com/rwx-cloud/packages/issues

parameters:
  ruby-version:
    description: "Version of Ruby to install"
    required: false
  ruby-version-file:
    description: "File containing version of Ruby to install, commonly .ruby-version"
    required: false

tasks:
  - key: install-ruby
    run: |
      set -u

      #
      # Check OS support
      #
      source "$RWX_PACKAGE_PATH/rwx-utils.sh"
      if ! rwx_os_package_manager_in apt; then
        echo "Unsupported operating system or package manager \`$(rwx_os_package_manager)\`" > "$(mktemp "$RWX_ERRORS/error-XXXX")"
        exit 1
      fi

      #
      # Ensure we have a ruby version
      #
      if [ "$RUBY_VERSION" = "" ]; then
        if [ "$RUBY_VERSION_FILE" = "" ]; then
          cat << EOF > $(mktemp "$RWX_ERRORS/error-XXXX")
      Invalid parameters: \`ruby-version\` or \`ruby-version-file\` must be set.
      EOF
          exit 2
        fi

        RUBY_VERSION="$(cat "$RUBY_VERSION_FILE" | sed 's/ruby-//')"
        if [ "$RUBY_VERSION" = "" ]; then
          cat << EOF > $(mktemp "$RWX_ERRORS/error-XXXX")
      Invalid parameters: the contents of \`ruby-version-file\` did not specify a Ruby version.
      EOF
          exit 2
        fi
      fi

      #
      # Ensure prerequisites for installing mise
      #
      if ! command -v curl >/dev/null 2>&1; then
        rwx_maybe_sudo apt-get update
        rwx_maybe_sudo apt-get install --no-upgrade -y curl ca-certificates
        rwx_maybe_sudo apt-get clean
      fi

      #
      # Install mise into a temporary directory. mise resolves the Ruby
      # version to the right precompiled binary and verifies its checksum;
      # the Ruby install is moved out and mise is deleted afterwards, so
      # mise itself is not persisted in the task's filesystem.
      #
      mise_dir=$(mktemp -d)
      export MISE_INSTALL_PATH="$mise_dir/bin/mise"
      export MISE_DATA_DIR="$mise_dir/data"
      export MISE_CACHE_DIR="$mise_dir/cache"
      export MISE_STATE_DIR="$mise_dir/state"
      export MISE_CONFIG_DIR="$mise_dir/config"

      curl -fsSL https://mise.run | sh
      export PATH="$mise_dir/bin:$PATH"
      mise --version

      #
      # Install Ruby from the mise precompiled binaries.
      # MISE_RUBY_COMPILE=false errors out if no precompiled binary is
      # available rather than falling back to compiling from source.
      #
      echo "Installing Ruby $RUBY_VERSION..."
      if ! MISE_RUBY_COMPILE=false mise install "ruby@$RUBY_VERSION"; then
        cat << EOF > $(mktemp "$RWX_ERRORS/error-XXXX")
      Ruby $RUBY_VERSION is not available as a [mise precompiled binary](https://mise.jdx.dev/lang/ruby.html#precompiled-binaries) for this platform.
      [ruby/install](https://www.rwx.com/docs/mint/packages/ruby/install) supports any Ruby version with a precompiled binary available.
      EOF
        exit 3
      fi

      #
      # Move Ruby to its final home and remove mise. The precompiled
      # binaries are relocatable, so they run from any directory.
      #
      source_dir=$(realpath "$(mise where "ruby@$RUBY_VERSION")")
      resolved_version=$(basename "$source_dir")
      path_to_ruby_home="$HOME/.rubies/ruby-$resolved_version"
      mkdir -p "$HOME/.rubies"
      rm -rf "$path_to_ruby_home"
      mv "$source_dir" "$path_to_ruby_home"
      rm -rf "$mise_dir"

      # mise adds a rubygems plugin that runs `mise reshim` after every
      # `gem install`; without mise present it makes gem commands fail.
      rm -f "$path_to_ruby_home/lib/ruby/site_ruby/rubygems_plugin.rb"

      echo "Installed Ruby $resolved_version!"

      # Add Ruby to PATH
      path_to_ruby="$path_to_ruby_home/bin"
      echo "Adding $path_to_ruby to \$PATH"
      echo "$path_to_ruby" >> "$RWX_ENV/PATH"
    env:
      RUBY_VERSION: ${{ params.ruby-version }}
      RUBY_VERSION_FILE: ${{ params.ruby-version-file }}
