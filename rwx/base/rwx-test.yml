base:
  image: ${{ init.base-image }}
  config: ${{ init.base-config }}
  arch: ${{ init.base-arch }}

tasks:
  - key: base
    call: ${{ init.package-digest }}

  - key: test-user
    use: base
    run: |
      cat /etc/os-release
      # Ubuntu 24.04+ ships a default `ubuntu` user at UID 1000 which our
      # base config preserves. On older Ubuntu and on Debian, UID 1000 is
      # unused and our base config creates an `rwx` user there.
      case "${{ init.base-image }}" in
        ubuntu:24.04|ubuntu:26.04) expected_user=ubuntu ;;
        *) expected_user=rwx ;;
      esac
      test "$(whoami)" == "$expected_user"
      test "$(id -u)" == "1000"
      test "$(sudo whoami)" == "root"

  - key: test-ca-certificates
    use: base
    run: |
      sudo update-ca-certificates
      subjects=$(openssl crl2pkcs7 -nocrl -certfile /etc/ssl/certs/ca-certificates.crt | openssl pkcs7 -print_certs -noout)
      for root in 'AAA Certificate Services' 'emSign Root TLS CA - G3' 'emSign ECC Root CA - G3'; do
        if grep -Fq "$root" <<< "$subjects"; then
          echo "Compromised trust path remains in the CA bundle: $root"
          exit 1
        fi
      done
      for root in Comodo_AAA_Services_root emSign_Root_TLS_CA_-_G3 emSign_ECC_Root_CA_-_G3; do
        test ! -e "/etc/ssl/certs/$root.pem"
      done
      openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt -no-CApath /usr/share/ca-certificates/mozilla/emSign_Root_CA_-_G1.crt
      openssl verify -no-CAfile -CApath /etc/ssl/certs /usr/share/ca-certificates/mozilla/emSign_Root_CA_-_G1.crt

  - key: test-docker
    use: base
    docker: true
    run: docker run hello-world
