base:
  image: ${{ init.base-image }}
  config: ${{ init.base-config }}
  arch: ${{ init.base-arch }}

tasks:
  - key: base
    call: ${{ init.package-digest }}

  - key: test-user
    use: base
    run: |
      cat /etc/os-release
      # Ubuntu 24.04+ ships a default `ubuntu` user at UID 1000 which our
      # base config preserves. On older Ubuntu and on Debian, UID 1000 is
      # unused and our base config creates an `rwx` user there.
      case "${{ init.base-image }}" in
        ubuntu:24.04|ubuntu:26.04) expected_user=ubuntu ;;
        *) expected_user=rwx ;;
      esac
      test "$(whoami)" == "$expected_user"
      test "$(id -u)" == "1000"
      test "$(sudo whoami)" == "root"

  - key: test-sudo
    use: base
    run: |
      admin_flag_supported=false
      case "${{ init.base-image }}" in
        ubuntu:22.04|ubuntu:24.04|debian:12|debian:13) admin_flag_supported=true ;;
      esac
      if $admin_flag_supported; then
        test "$(sudo -n cat /etc/sudoers.d/disable_admin_file_in_home)" = 'Defaults !admin_flag'
      else
        test ! -e /etc/sudoers.d/disable_admin_file_in_home
      fi

      stderr_file="$(mktemp)"
      trap 'rm -f "$stderr_file"' EXIT
      root_user="$(sudo -n whoami 2>"$stderr_file")"
      cat "$stderr_file" >&2
      test "$root_user" = root
      test ! -s "$stderr_file"
      sudo -n visudo -c

      if $admin_flag_supported; then
        test ! -e "$HOME/.sudo_as_admin_successful"
      fi

  - key: test-docker
    use: base
    docker: true
    run: docker run hello-world
